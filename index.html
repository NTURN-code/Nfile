<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nfiles</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--head:#f3f4f6;--acc:#1a73e8;--sel:#e8f0fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e6e8eb;--mut:#9aa1a9;--line:#3a3f46;--head:#23272d;--acc:#6ea8fe;--sel:#24324a}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e6e8eb;--mut:#9aa1a9;--line:#3a3f46;--head:#23272d;--acc:#6ea8fe;--sel:#24324a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--fg)}
button,.btn{background:var(--head);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-block;transition:border-color .15s,background .15s,transform .1s}
button:hover,.btn:hover{border-color:var(--acc)}button:active{transform:scale(.97)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.mut,small{color:var(--mut)}
#sb{width:236px;border-right:1px solid var(--line);overflow:auto;padding:10px;flex:none;background:var(--head);box-sizing:border-box}
.logo{font-size:18px;font-weight:700;margin:4px 6px 10px}
#sb h4{margin:14px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
#sb h4 button{padding:0 7px}
.ni{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.ni:hover{background:var(--sel)}.ni.on{background:var(--acc);color:#fff}.ni small{margin-left:auto;color:inherit;opacity:.7}
.ni .x{display:none;padding:0 6px;margin-left:4px}.ni:hover .x{display:inline-block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
#su{margin:14px 6px}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:120px}#menub{display:none}
#bc{padding:8px 12px;color:var(--mut)}#bc a{cursor:pointer;color:var(--acc)}
#sbar{display:none;gap:6px;padding:6px 12px;align-items:center;flex-wrap:wrap;background:var(--sel)}
#list{flex:1;overflow:auto;padding:10px 12px 70px;transition:background .15s}
#list.dz{background:var(--sel);outline:2px dashed var(--acc);outline-offset:-8px}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.it{position:relative;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.it:hover{border-color:var(--acc)}.it.sel{background:var(--sel);border-color:var(--acc)}.it.dr{outline:2px solid var(--acc)}
.grid .it{padding:10px;text-align:center}.grid .ic{height:84px;display:flex;align-items:center;justify-content:center;font-size:44px}
.ic img{max-width:100%;max-height:84px;border-radius:6px}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.nm small{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-bottom:6px}.list .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}.list .ic img{max-height:36px}.list .nm{flex:1;min-width:0}
.ck{position:absolute;top:6px;left:6px;opacity:0}.it:hover .ck,.it.sel .ck{opacity:1}.list .ck{position:static;opacity:1}
.mo{position:absolute;top:4px;right:4px;padding:0 7px;border:0;background:transparent}.list .mo{position:static}
.tgs{position:absolute;bottom:6px;right:8px;display:flex;gap:3px;font-size:11px}.list .tgs{position:static}
.empty{text-align:center;color:var(--mut);padding:60px 20px;grid-column:1/-1}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.cardx{border:1px solid var(--line);border-radius:10px;padding:14px}.cardx h3{margin:0 0 8px}
.row2{display:flex;align-items:center;gap:8px;padding:3px 0}.row2 span{min-width:110px;flex:0 1 150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row2 .bar{flex:1}
#cm{position:fixed;display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:4px;z-index:50;min-width:180px}
#cm button{display:block;width:100%;text-align:left;border:0;background:transparent}#cm button:hover{background:var(--sel)}#cm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;animation:f .15s}.ov.on{display:flex}@keyframes f{from{opacity:0}}
.ov>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(460px,92vw);max-height:90vh;overflow:auto;box-sizing:border-box}
.ov h3{margin:0 0 10px}.ov label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}.ov input:not([type=checkbox]),.ov textarea{width:100%;box-sizing:border-box}
.bs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.mb{display:block;width:100%;text-align:left;margin-bottom:5px}
.chip{border:1px solid var(--c);color:var(--c);border-radius:12px;padding:2px 10px;cursor:pointer;margin:2px;display:inline-block}.chip.on{background:var(--c);color:#fff}
#pv{background:rgba(0,0,0,.88);flex-direction:column;align-items:stretch;z-index:70}#pv.on{display:flex}
#pvh{display:flex;gap:6px;align-items:center;padding:10px;color:#fff}#pvh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pvb{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:0 10px 10px;color:#fff}
#pvb img,#pvb video{max-width:100%;max-height:100%}#pvb iframe{width:100%;height:100%;border:0;background:#fff}
#pvb pre{align-self:flex-start;white-space:pre-wrap;word-break:break-word;background:var(--bg);color:var(--fg);padding:12px;border-radius:8px;width:100%;box-sizing:border-box;margin:0}
.tw{align-self:flex-start;background:var(--bg);color:var(--fg);padding:8px;border-radius:8px;overflow:auto;max-width:100%}.tw table{border-collapse:collapse}.tw td,.tw th{border:1px solid var(--line);padding:3px 8px}
#toast{position:fixed;bottom:76px;left:50%;transform:translate(-50%,20px);background:#222;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:90}#toast.on{opacity:1;transform:translate(-50%,0)}
#bn{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--head);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
#bn button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 0;font-size:12px}#bn button.on{color:var(--acc)}
@media(max-width:800px){#sb{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:260px;padding-top:calc(10px + env(safe-area-inset-top,0px))}#sb.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.4)}#bn{display:flex}#menub{display:inline-block}}
</style>
</head>
<body>
<aside id="sb"></aside>
<div id="mn">
  <div id="top">
    <button id="menub">☰</button>
    <input id="q" type="search" placeholder="Search files, tags, notes…">
    <select id="ft"><option value="">All types</option></select>
    <select id="so"><option value="name">Name</option><option value="date">Date</option><option value="size">Size</option><option value="type">Type</option></select>
    <button id="lay" title="Grid / list">▦</button>
    <button class="pri" id="newb">+ New</button>
  </div>
  <div id="bc"></div>
  <div id="sbar"></div>
  <div id="list" class="grid"></div>
</div>
<nav id="bn"><button data-nav="files">📁<br>Files</button><button data-nav="recent">🕒<br>Recent</button><button data-nav="starred">⭐<br>Starred</button><button data-nav="trash">🗑<br>Trash</button><button id="more">☰<br>More</button></nav>
<div id="cm"></div>
<div class="ov" id="md"><div><h3 id="mt"></h3><div id="mb"></div></div></div>
<div class="ov" id="pv"><div id="pvh"><b id="pvt"></b><button id="pvp">◀</button><button id="pvn">▶</button><button id="pvs">Share</button><button id="pvd">⬇ Download</button><button id="pvx">✕</button></div><div id="pvb"></div></div>
<div id="toast"></div>
<input type="file" id="uf" multiple hidden><input type="file" id="ud" webkitdirectory multiple hidden><input type="file" id="uc" accept="image/*" capture="environment" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DB,ITEMS=new Map(),META={tags:[]},clip=null,lp=false,tt;
try{META=JSON.parse(localStorage.getItem('nfiles.meta'))||META}catch(e){}
const S={nav:'files',cwd:null,q:'',sort:'name',type:'',layout:(()=>{try{return localStorage.getItem('nfiles.layout')||'grid'}catch(e){return'grid'}})(),sel:new Set(),last:null};
const DESK=matchMedia('(hover:hover) and (pointer:fine)').matches;
const saveMeta=()=>{try{localStorage.setItem('nfiles.meta',JSON.stringify(META))}catch(e){}};
const CATS={Images:'🖼',Videos:'🎬',Audio:'🎵',PDFs:'📕',Documents:'📄',Sheets:'📊',Presentations:'📽',Archives:'🗜',Others:'📎'};
const PAL=['#d93025','#e8710a','#f4b400','#188038','#1a73e8','#8e24aa','#d81b60','#00897b'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ext=n=>(n.includes('.')?n.split('.').pop():'').toLowerCase();
const fsz=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const fdt=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function toast(t,st){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);if(!st)tt=setTimeout(()=>e.classList.remove('on'),2600)}
function cat(i){const e=ext(i.name),m=i.mime||'';if(m.startsWith('image/'))return'Images';if(m.startsWith('video/'))return'Videos';if(m.startsWith('audio/'))return'Audio';if(e==='pdf')return'PDFs';if(['doc','docx','txt','md','rtf','odt','html'].includes(e))return'Documents';if(['xls','xlsx','csv','ods'].includes(e))return'Sheets';if(['ppt','pptx','odp'].includes(e))return'Presentations';if(['zip','rar','7z','tar','gz'].includes(e))return'Archives';return'Others'}
/* ---- storage (IndexedDB) ---- */
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('nfiles',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=(st,mode,fn)=>new Promise((res,rej)=>{const t=DB.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)});
const putI=it=>{ITEMS.set(it.id,it);return rq('items','readwrite',s=>s.put(it))};
const putB=(id,b)=>rq('blobs','readwrite',s=>s.put(b,id));
const getB=id=>rq('blobs','readonly',s=>s.get(id));
const delI=id=>{ITEMS.delete(id);return Promise.all([rq('items','readwrite',s=>s.delete(id)),rq('blobs','readwrite',s=>s.delete(id))])};
/* ---- tree helpers ---- */
const kids=p=>[...ITEMS.values()].filter(i=>i.parent===p);
function dead(it){while(it){if(it.trashed)return true;it=ITEMS.get(it.parent)}return false}
const alive=()=>[...ITEMS.values()].filter(i=>!dead(i));
function path(it){const a=[];let p=ITEMS.get(it.parent);while(p){a.unshift(p.name);p=ITEMS.get(p.parent)}return'/'+a.join('/')}
function desc(id){const o=[],w=p=>kids(p).forEach(k=>{o.push(k);if(k.type==='folder')w(k.id)});w(id);return o}
function uniq(parent,name,ex){const ns=new Set(kids(parent).filter(i=>!i.trashed&&i.id!==ex).map(i=>i.name));if(!ns.has(name))return name;const d=name.lastIndexOf('.'),b=d>0?name.slice(0,d):name,e=d>0?name.slice(d):'';let n=1;while(ns.has(`${b} (${n})${e}`))n++;return`${b} (${n})${e}`}
async function mkFolder(name,parent){const it={id:uid(),type:'folder',name:uniq(parent,name),parent,created:Date.now(),modified:Date.now(),tags:[],note:'',starred:false,color:''};await putI(it);return it}
function thumb(f){return new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,180/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>{URL.revokeObjectURL(u);r('')};i.src=u})}
async function addFile(f,parent){const it={id:uid(),type:'file',name:uniq(parent,f.name),parent,size:f.size,mime:f.type,created:Date.now(),modified:f.lastModified||Date.now(),opened:Date.now(),tags:[],note:'',starred:false};if(f.type.startsWith('image/'))it.thumb=await thumb(f);await putB(it.id,f);await putI(it);return it}
async function upload(files,parent){if(!files.length)return;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}const cache={};let n=0;
  for(const f of files){toast(`Uploading ${++n} of ${files.length}…`,true);let p=parent;const rel=f.webkitRelativePath||f._rel;
    if(rel){let k='';for(const d of rel.split('/').slice(0,-1)){k+='/'+d;if(!cache[k])cache[k]=(await mkFolder(d,p)).id;p=cache[k]}}
    try{await addFile(f,p)}catch(e){toast('Could not save '+f.name+'. Storage may be full.');await new Promise(r=>setTimeout(r,1500))}}
  toast('Uploaded '+files.length+' file(s)');render()}
async function walkEntry(en,path,out){if(en.isFile){const f=await new Promise(r=>en.file(r));f._rel=path+en.name;out.push(f)}else{const rd=en.createReader();let all=[];for(;;){const b=await new Promise(r=>rd.readEntries(r));if(!b.length)break;all=all.concat(b)}for(const c of all)await walkEntry(c,path+en.name+'/',out)}}
async function cp(i,dest){const n=Object.assign({},i,{id:uid(),parent:dest,name:uniq(dest,i.name),created:Date.now(),modified:Date.now()});delete n.trashed;await putI(n);if(i.type==='file'){const b=await getB(i.id);if(b)await putB(n.id,b)}else for(const k of kids(i.id).filter(k=>!k.trashed))await cp(k,n.id);return n}
/* ---- modal helpers ---- */
function modal(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('md').classList.add('on');return $('mb')}
const closeM=()=>$('md').classList.remove('on');$('md').onclick=e=>{if(e.target===$('md'))closeM()};
function ask(t,fs,ok,cb){const b=modal(t,fs.map(f=>`<label>${f.l}</label><input id="a_${f.k}" value="${esc(f.v)}">`).join('')+`<div class="bs"><button class="pri" id="a_ok">${ok}</button><button id="a_no">Cancel</button></div>`);b.querySelector('input').focus();b.querySelector('input').select();
  $('a_no').onclick=closeM;$('a_ok').onclick=()=>{const v={};fs.forEach(f=>v[f.k]=$('a_'+f.k).value);closeM();cb(v)};b.onkeydown=e=>{if(e.key==='Enter')$('a_ok').click()}}
function confirmBox(t,cb){modal(t,'<div class="bs"><button class="pri" id="cy">Yes</button><button id="cn">Cancel</button></div>');$('cn').onclick=closeM;$('cy').onclick=()=>{closeM();cb()}}
function pick(t,its,cb){const ex=new Set();its.forEach(i=>{ex.add(i.id);desc(i.id).forEach(d=>ex.add(d.id))});
  const fs=[...ITEMS.values()].filter(i=>i.type==='folder'&&!dead(i)&&!ex.has(i.id)).map(i=>({i,p:path(i)+'/'+i.name})).sort((a,b)=>a.p.localeCompare(b.p));
  const b=modal(t,'<button class="mb" data-f="">📁 My files (root)</button>'+fs.map(x=>`<button class="mb" data-f="${x.i.id}" style="padding-left:${10+(x.p.split('/').length-2)*14}px">📁 ${esc(x.i.name)}</button>`).join(''));
  b.onclick=e=>{const k=e.target.closest('[data-f]');if(k){closeM();cb(k.dataset.f||null)}}}
/* ---- views ---- */
function visible(){const A=alive();let a;
  if(S.q){const q=S.q.toLowerCase();a=A.filter(i=>i.name.toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q)||(i.tags||[]).some(t=>t.toLowerCase().includes(q)))}
  else if(S.nav==='files')a=A.filter(i=>i.parent===S.cwd);
  else if(S.nav==='recent')a=A.filter(i=>i.type==='file'&&i.opened).sort((x,y)=>y.opened-x.opened).slice(0,60);
  else if(S.nav==='starred')a=A.filter(i=>i.starred);
  else if(S.nav==='trash')a=[...ITEMS.values()].filter(i=>i.trashed);
  else if(S.nav.startsWith('cat:'))a=A.filter(i=>i.type==='file'&&cat(i)===S.nav.slice(4));
  else if(S.nav.startsWith('tag:'))a=A.filter(i=>(i.tags||[]).includes(S.nav.slice(4)));
  else a=[];
  if(S.type)a=a.filter(i=>i.type==='file'&&cat(i)===S.type);
  if(S.nav!=='recent'){const k=S.sort;a.sort((x,y)=>(x.type==='folder'?0:1)-(y.type==='folder'?0:1)||(k==='date'?y.modified-x.modified:k==='size'?(y.size||0)-(x.size||0):k==='type'?cat(x).localeCompare(cat(y)):x.name.localeCompare(y.name,undefined,{numeric:true})))}
  return a}
function side(){const A=alive(),cc={};A.forEach(i=>{if(i.type==='file'){const c=cat(i);cc[c]=(cc[c]||0)+1}});
  const nv=(k,i,t,c='',x='')=>`<a class="ni${S.nav===k&&!S.q?' on':''}" data-nav="${esc(k)}">${i} <span>${t}</span><small>${c}</small>${x}</a>`;
  $('sb').innerHTML='<div class="logo">🗂 Nfiles</div>'+nv('files','📁','My files')+nv('recent','🕒','Recent')+nv('starred','⭐','Starred')+nv('trash','🗑','Trash',[...ITEMS.values()].filter(i=>i.trashed).length||'')+nv('storage','📈','Storage &amp; backup')+'<h4>Categories</h4>'+Object.keys(CATS).map(c=>nv('cat:'+c,CATS[c],c,cc[c]||'')).join('')+'<h4>Tags <button id="tgp">+</button></h4>'+(META.tags.map(t=>nv('tag:'+t.n,`<i class="dot" style="background:${t.c}"></i>`,esc(t.n),A.filter(i=>(i.tags||[]).includes(t.n)).length||'',`<button class="x" data-dt="${esc(t.n)}">×</button>`)).join('')||'<small>No tags yet</small>')+'<div id="su"></div>';
  document.querySelectorAll('#bn [data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.nav));
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const s=$('su');if(s)s.innerHTML=`<div class="bar"><i style="width:${Math.min(100,(e.usage/e.quota*100)||0).toFixed(1)}%"></i></div><small>${fsz(e.usage||0)} used of ${fsz(e.quota||0)}</small>`})}
function crumbs(){let h='';if(S.q)h=`Search results for “${esc(S.q)}”`;
  else if(S.nav==='files'){const a=[];let p=ITEMS.get(S.cwd);while(p){a.unshift(p);p=ITEMS.get(p.parent)}h='<a data-cd="">My files</a>'+a.map(p=>` › <a data-cd="${p.id}">${esc(p.name)}</a>`).join('')}
  else h=({recent:'Recent files',starred:'Starred',trash:'Trash (items are deleted after 30 days)',storage:'Storage & backup'})[S.nav]||S.nav.replace(/^(cat|tag):/,'');
  if(S.nav==='trash'&&!S.q&&[...ITEMS.values()].some(i=>i.trashed))h+=' <button id="et">Empty trash</button>';$('bc').innerHTML=h}
const sel=()=>[...S.sel].map(id=>ITEMS.get(id)).filter(Boolean);
function selbar(){const its=sel(),b=$('sbar');if(!its.length){b.style.display='none';return}const tr=S.nav==='trash',B=(a,t)=>`<button data-a="${a}">${t}</button>`;
  b.style.display='flex';b.innerHTML=`<b>${its.length} selected</b>`+(tr?B('res','Restore')+B('purge','Delete forever'):B('dl','Download')+B('mv','Move')+B('cp','Copy')+B('star','⭐')+B('tag','Tags')+(its.length===1?B('ren','Rename')+B('info','Details'):'')+B('del','Delete'))+B('clr','✕')}
function selUI(){document.querySelectorAll('.it').forEach(x=>{const s=S.sel.has(x.dataset.id);x.classList.toggle('sel',s);x.querySelector('.ck').checked=s});selbar()}

(async()=>{try{DB=await openDB();(await rq('items','readonly',s=>s.getAll())||[]).forEach(i=>ITEMS.set(i.id,i));
  const lim=Date.now()-30*864e5;for(const i of[...ITEMS.values()])if(i.trashed&&i.trashed<lim)await purge([i]);render()}
  catch(e){L.innerHTML='<div class="empty">File storage is not available in this browser (private mode may block it).</div>'}})();
</script>
